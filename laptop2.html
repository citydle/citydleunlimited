<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Guesser Game</title>
  <style>
    :root {
      --color-correct: #6aaa64; /* Green */
      --color-country: #c9b458; /* Yellow */
      --color-continent: #f57c00; /* Orange */
      --color-incorrect: #787c7e; /* Gray */
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121213;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #818384;
      margin-bottom: 20px;
    }

    /* Controls Panel */
    .controls {
      background-color: #1a1a1b;
      border: 1px solid #3a3a3c;
      padding: 15px 25px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 350px;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    /* CSS Switch Slider */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--color-correct);
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    .btn {
      background-color: #565758;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #666;
    }

    .btn-danger {
      background-color: #b03a2e;
    }

    .btn-danger:hover {
      background-color: #cb4335;
    }

    /* Game Input Section */
    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 400px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #3a3a3c;
      background-color: #121213;
      color: white;
      font-size: 16px;
    }

    /* Grid layout for Guesses */
    .grid-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 20px;
    }

    .guess-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background-color: #1a1a1b;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #3a3a3c;
    }

    .letters-container {
      display: flex;
      gap: 4px;
    }

    .letter-box {
      width: 32px;
      height: 32px;
      border: 2px solid #565758;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      text-transform: uppercase;
      border-radius: 4px;
    }

    /* Feedback Colors */
    .box-correct {
      background-color: var(--color-correct);
      border-color: var(--color-correct);
    }

    .box-country {
      background-color: var(--color-country);
      border-color: var(--color-country);
    }

    .box-continent {
      background-color: var(--color-continent);
      border-color: var(--color-continent);
    }

    .box-incorrect {
      background-color: var(--color-incorrect);
      border-color: var(--color-incorrect);
    }

    .distance-info {
      font-size: 14px;
      color: #a4a6a8;
      font-weight: 500;
      white-space: nowrap;
    }

    /* Modal / Message Overlay */
    .message-banner {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      min-height: 27px;
    }
  </style>
</head>
<body>

  <h1>GeoWordle City Guesser</h1>
  <div class="subtitle" id="guess-counter-ui">Guesses: 0 / 6</div>

  <!-- 2 & 3: Controls Panel with Toggle Switch & Reveal Button -->
  <div class="controls">
    <div class="toggle-container">
      <span>Enable Extra Guesses (+4 next game)</span>
      <label class="switch">
        <input type="checkbox" id="extra-guesses-toggle">
        <span class="slider"></span>
      </label>
    </div>
    <button id="reveal-btn" class="btn btn-danger">Reveal Answer</button>
  </div>

  <!-- 1: Game input leveraging the interactive datalist of sorted cities -->
  <div class="input-section">
    <input type="text" id="city-input" list="city-choices" placeholder="Type or select a city...">
    <datalist id="city-choices"></datalist>
    <button id="submit-btn" class="btn" style="width: auto;">Guess</button>
  </div>

  <!-- Game Grid -->
  <div class="grid-container" id="grid"></div>

  <!-- Status / Alert Message Banner -->
  <div class="message-banner" id="message-banner"></div>
  <button id="reset-btn" class="btn" style="width: auto; margin-top: 10px; display: none;">Play Again</button>

  <script>
    // System City Database (Sample Set)
    const cities = [
      { name: "Tokyo", country: "Japan", continent: "Asia", lat: 35.6762, lon: 139.6503 },
      { name: "London", country: "United Kingdom", continent: "Europe", lat: 51.5074, lon: -0.1278 },
      { name: "Paris", country: "France", continent: "Europe", lat: 48.8566, lon: 2.3522 },
      { name: "New York", country: "United States", continent: "North America", lat: 40.7128, lon: -74.0060 },
      { name: "Sydney", country: "Australia", continent: "Oceania", lat: -33.8688, lon: 151.2093 },
      { name: "Cairo", country: "Egypt", continent: "Africa", lat: 30.0444, lon: 31.2357 },
      { name: "Rio de Janeiro", country: "Brazil", continent: "South America", lat: -22.9068, lon: -43.1729 },
      { name: "Amsterdam", country: "Netherlands", continent: "Europe", lat: 52.3676, lon: 4.9041 },
      { name: "Bangkok", country: "Thailand", continent: "Asia", lat: 13.7563, lon: 100.5018 },
      { name: "Dublin", country: "Ireland", continent: "Europe", lat: 53.3498, lon: -6.2603 },
      { name: "Cape Town", country: "South Africa", continent: "Africa", lat: -33.9249, lon: 18.4241 },
      { name: "Toronto", country: "Canada", continent: "North America", lat: 43.6532, lon: -79.3832 },
      { name: "Mumbai", country: "India", continent: "Asia", lat: 19.0760, lon: 72.8777 },
      { name: "Buenos Aires", country: "Argentina", continent: "South America", lat: -34.6037, lon: -58.3816 }
    ];

    // Game Variables
    let targetCity = null;
    let maxGuesses = 6;
    let currentGuesses = 0;
    let gameOver = false;

    // DOM Elements
    const cityChoices = document.getElementById('city-choices');
    const cityInput = document.getElementById('city-input');
    const submitBtn = document.getElementById('submit-btn');
    const grid = document.getElementById('grid');
    const messageBanner = document.getElementById('message-banner');
    const guessCounterUi = document.getElementById('guess-counter-ui');
    const extraGuessesToggle = document.getElementById('extra-guesses-toggle');
    const revealBtn = document.getElementById('reveal-btn');
    const resetBtn = document.getElementById('reset-btn');

    // --- REQUIREMENT 1: Populating Alphabetical Dropdown Datatlist ---
    function populateCityList() {
      cityChoices.innerHTML = "";
      // Clone and sort the cities array alphabetically by name
      const sortedCities = [...cities].sort((a, b) => a.name.localeCompare(b.name));
      
      sortedCities.forEach(city => {
        const option = document.createElement('option');
        option.value = city.name;
        cityChoices.appendChild(option);
      });
    }

    // --- Auxiliary: Great-circle distance (Haversine formula) ---
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth's radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c);
    }

    // Initialize Game State
    function initGame() {
      // Pick random target
      targetCity = cities[Math.floor(Math.random() * cities.length)];
      
      // --- REQUIREMENT 2: Read Slider State (Applies to Next Game) ---
      maxGuesses = extraGuessesToggle.checked ? 10 : 6;
      
      currentGuesses = 0;
      gameOver = false;
      
      // UI Reset
      grid.innerHTML = "";
      messageBanner.textContent = "";
      messageBanner.style.color = "#fff";
      cityInput.value = "";
      cityInput.disabled = false;
      submitBtn.disabled = false;
      revealBtn.disabled = false;
      resetBtn.style.display = "none";
      updateGuessCounter();
      
      console.log("Cheat Sheet Target:", targetCity.name); // Debugging aid
    }

    function updateGuessCounter() {
      guessCounterUi.textContent = `Guesses: ${currentGuesses} / ${maxGuesses}`;
    }

    // Submit Guess Logic
    function submitGuess() {
      if (gameOver) return;

      const guessName = cityInput.value.trim();
      const matchedCity = cities.find(c => c.name.toLowerCase() === guessName.toLowerCase());

      if (!matchedCity) {
        messageBanner.textContent = "Please select a valid city from the list!";
        messageBanner.style.color = "#ff4d4d";
        return;
      }

      messageBanner.textContent = ""; // Clear errors
      currentGuesses++;
      updateGuessCounter();

      // Calculations
      const distance = calculateDistance(matchedCity.lat, matchedCity.lon, targetCity.lat, targetCity.lon);
      
      // Color Logic determination
      let statusClass = "box-incorrect";
      if (matchedCity.name === targetCity.name) {
        statusClass = "box-correct";
      } else if (matchedCity.country === targetCity.country) {
        statusClass = "box-country";
      } else if (matchedCity.continent === targetCity.continent) {
        statusClass = "box-continent";
      }

      // Create Guess visual Row
      const row = document.createElement('div');
      row.className = "guess-row";

      // One letter per box
      const lettersDiv = document.createElement('div');
      lettersDiv.className = "letters-container";
      
      for (let i = 0; i < matchedCity.name.length; i++) {
        const char = matchedCity.name[i];
        if (char === " ") continue; // Skip space rendering cleanly
        const box = document.createElement('div');
        box.className = `letter-box ${statusClass}`;
        box.textContent = char;
        lettersDiv.appendChild(box);
      }

      row.appendChild(lettersDiv);

      // Distance tag
      const distSpan = document.createElement('span');
      distSpan.className = "distance-info";
      distSpan.textContent = matchedCity.name === targetCity.name ? "Correct!" : `${distance} km away`;
      row.appendChild(distSpan);

      grid.appendChild(row);
      cityInput.value = "";

      // Win / Lose Checks
      if (matchedCity.name === targetCity.name) {
        endGame(true);
      } else if (currentGuesses >= maxGuesses) {
        endGame(false);
      }
    }

    // End Game State Handler
    function endGame(won) {
      gameOver = true;
      cityInput.disabled = true;
      submitBtn.disabled = true;
      revealBtn.disabled = true;
      resetBtn.style.display = "inline-block";

      if (won) {
        messageBanner.textContent = `🎉 Congratulations! You guessed the correct city: ${targetCity.name}!`;
        messageBanner.style.color = "var(--color-correct)";
      } else {
        // Normal game over loss text
        messageBanner.textContent = `💥 Game Over! The correct city was: ${targetCity.name} (${targetCity.country}, ${targetCity.continent})`;
        messageBanner.style.color = "#ff4d4d";
      }
    }

    // --- REQUIREMENT 3: "Reveal Answer" click logic ---
    revealBtn.addEventListener('click', () => {
      if (gameOver) return;
      // Triggers immediate game end styling exactly like a loss state
      endGame(false);
    });

    // Event Listeners
    submitBtn.addEventListener('click', submitGuess);
    cityInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitGuess();
    });
    resetBtn.addEventListener('click', initGame);

    // Initial load runs
    populateCityList();
    initGame();
  </script>
</body>
</html>
