        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
        }
        h1 {
            color: #333;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        #guess-input {
            padding: 15px;
            font-size: 20px;
        }
        #guess-button {
            padding: 10px 20px;
            font-size: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        #guess-button:hover {
            background-color: #45a049;
        }
        /* New styles for the added controls */
        #extra-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background-color: #e0e0e0;
            padding: 15px;
            border-radius: 8px;
        }
        .toggle-row {
            display: flex;
            gap: 15px;
        }
        #reveal-button {
            padding: 8px 15px;
            font-size: 16px;
            background-color: #f44336;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        #reveal-button:hover {
            background-color: #d32f2f;
        }
        /* End new styles */
        #guesses {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .guess-row {
            display: flex;
            gap: 15px;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        .orange {
            background-color: #FFA500;
        }
        .yellow {
            background-color: #FFFF00;
        }
        .green {
            background-color: #00FF00;
        }
        #distance {
            font-weight: bold;
            margin-top: 30px;
        }
        #result {
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Citydle</h1>
    <div id="game-container">
        <input type="text" id="guess-input" placeholder="Enter a city name">
        <button id="guess-button">Guess</button>
        
        <!-- NEWLY ADDED: Toggles and Reveal Button -->
        <div id="extra-controls">
            <div class="toggle-row">
                <label>
                    <input type="checkbox" id="extra-guesses-toggle"> Enable 4 Extra Guesses
                </label>
                <label>
                    <input type="checkbox" id="reveal-info-toggle"> Reveal Country & Continent
                </label>
            </div>
            <button id="reveal-button">Reveal Answer</button>
        </div>
        <!-- END NEWLY ADDED -->

        <div id="guesses"></div>
        <div id="distance"></div>
        <div id="result"></div>
    </div>

            {name: "Tashkent", lat: 41.2995, lon: 69.2401, continent: "Asia", country: "Uzbekistan"},
            {name: "Jizzax", lat: 40.1158, lon: 67.8422, continent: "Asia", country: "Uzbekistan"},
            {name: "Samarqand", lat: 39.6542, lon: 66.9597, continent: "Asia", country: "Uzbekistan"},
            {name: "Namangan", lat: 41.0011, lon: 71.6716, continent: "Asia", country: "Uzbekistan"},

            {name: "Bishkek", lat: 42.8746, lon: 74.5698, continent: "Asia", country: "Kyrgyzstan"},
            {name: "Osh", lat: 40.5140, lon: 72.8161, continent: "Asia", country: "Kyrgyzstan"},
            {name: "Dushanbe", lat: 38.5598, lon: 68.7870, continent: "Asia", country: "Tajikistan"},
            {name: "Khujand", lat: 40.2837, lon: 69.6219, continent: "Asia", country: "Tajikistan"},
            {name: "Kabul", lat: 34.5553, lon: 69.2075, continent: "Asia", country: "Afghanistan"},
            {name: "Islamabad", lat: 33.7215, lon: 73.0433, continent: "Asia", country: "Pakistan"},
            {name: "Lahore", lat: 31.5204, lon: 74.3587, continent: "Asia", country: "Pakistan"},
            {name: "Multan", lat: 30.1957, lon: 71.4708, continent: "Asia", country: "Pakistan"},
            {name: "Quetta", lat: 30.1798, lon: 66.9750, continent: "Asia", country: "Pakistan"},
            {name: "Karachi", lat: 24.8607, lon: 67.0011, continent: "Asia", country: "Pakistan"}
            // (Note: To save space in this block, I am truncating the city list here, but your full array goes here exactly as provided)
        ];

        let targetCity;
        let guessCount = 0;
        const maxGuesses = 15;

        function initGame() {
            targetCity = cities[Math.floor(Math.random() * cities.length)];
            guessCount = 0;
            document.getElementById('guesses').innerHTML = '';
            document.getElementById('distance').textContent = '';
            document.getElementById('result').textContent = '';
            
            // Reset buttons and inputs
            document.getElementById('guess-button').disabled = false;
            document.getElementById('reveal-button').disabled = false;
            document.getElementById('guess-input').disabled = false;
            document.getElementById('guess-input').value = '';
        }

        // Finished your cutoff distance function 
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        function handleGuess() {
            const inputVal = document.getElementById('guess-input').value.trim();
            if (!inputVal) return;

            const guessedCity = cities.find(c => c.name.toLowerCase() === inputVal.toLowerCase());
            
            if (!guessedCity) {
                alert("City not found. Try another one!");
                return;
            }

            guessCount++;
            const distance = calculateDistance(guessedCity.lat, guessedCity.lon, targetCity.lat, targetCity.lon);
            
            // Check if extra guesses toggle is enabled
            const isExtraEnabled = document.getElementById('extra-guesses-toggle').checked;
            const currentMaxGuesses = isExtraEnabled ? (maxGuesses + 4) : maxGuesses;
            
            // Check if reveal info toggle is enabled
            const revealInfo = document.getElementById('reveal-info-toggle').checked;
            
            // Create UI element for the guess
            const guessRow = document.createElement('div');
            guessRow.className = 'guess-row';
            
            // Format the string based on toggle
            let displayText = guessedCity.name;
            if (revealInfo) {
                displayText = `${guessedCity.country} - ${guessedCity.name} - ${guessedCity.continent}`;
            }

            guessRow.textContent = `${displayText} (${distance} km)`;
            
            // Apply colors based on distance
            if (distance === 0) {
                guessRow.classList.add('green');
                endGame(true);
            } else if (distance <= 1500) {
                guessRow.classList.add('yellow');
            } else {
                guessRow.classList.add('orange');
            }

            document.getElementById('guesses').appendChild(guessRow);
            document.getElementById('guess-input').value = '';
            document.getElementById('distance').textContent = `Distance: ${distance} km`;

            // Handle Loss Condition
            if (distance !== 0 && guessCount >= currentMaxGuesses) {
                endGame(false);
            }
        }

        // Function triggered when the user explicitly hits "Reveal Answer"
        function revealAnswer() {
            endGame(false);
        }

        // Logic for ending the game (win or loss)
        function endGame(isWin) {
            document.getElementById('guess-button').disabled = true;
            document.getElementById('reveal-button').disabled = true;
            document.getElementById('guess-input').disabled = true;

            const resultDiv = document.getElementById('result');
            if (isWin) {
                resultDiv.textContent = `Congratulations! You guessed it in ${guessCount} tries.`;
                resultDiv.style.color = "green";
            } else {
                resultDiv.textContent = `You lost! The city was ${targetCity.name}.`;
                resultDiv.style.color = "red";
            }
        }

        // Event Listeners
        document.getElementById('guess-button').addEventListener('click', handleGuess);
        document.getElementById('reveal-button').addEventListener('click', revealAnswer);
        
        // Allow user to hit 'Enter' to submit guess
        document.getElementById('guess-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleGuess();
            }
        });

        // Initialize the first game
        window.onload = initGame;
    </script>
</body>
</html>
