<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Chess</title>
    
    <!-- Chessboard.js Core CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 5px;
            color: #4caf50;
        }

        /* Responsive board wrapper */
        #board {
            width: 450px;
            max-width: 90vw;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        .info-panel {
            margin-top: 20px;
            text-align: center;
        }

        #status {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            background: #2a2a35;
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }

        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #45a049;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>GitHub Chess</h1>
    
    <!-- The Chessboard Container -->
    <div id="board"></div>

    <!-- Status and Controls -->
    <div class="info-panel">
        <div id="status">Loading game...</div>
        <button id="resetBtn">Restart Game</button>
    </div>

    <!-- Dependencies: jQuery, Chess.js (rules), and Chessboard.js (UI) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        // 1. Initialize logic engine (chess.js) and UI board placeholder
        var game = new Chess();
        var board = null;
        var $status = $('#status');

        // 2. Only allow dragging pieces if it's that player's actual turn
        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;

            // Prevent picking up wrong color pieces
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        // 3. Handle when a piece drops onto a square
        function onDrop (source, target) {
            // Check if move is legal
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' // Default auto-promote to Queen for simplicity
            });

            // If illegal, snap piece back to original spot
            if (move === null) return 'snapback';

            updateStatus();
        }

        // 4. Update board visuals (critical for special moves like castling/en passant)
        function onSnapEnd () {
            board.position(game.fen());
        }

        // 5. Update game state message (Turn, Check, Checkmate, Draw)
        function updateStatus () {
            var status = '';
            var moveColor = (game.turn() === 'b') ? 'Black' : 'White';

            if (game.in_checkmate()) {
                status = 'Game over! ' + moveColor + ' is in checkmate.';
            } else if (game.in_draw()) {
                status = 'Game over! Draw position.';
            } else {
                status = moveColor + ' to move';
                if (game.in_check()) {
                    status += ' (Check!)';
                }
            }
            $status.html(status);
        }

        // 6. Chessboard Configurations
        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            // Fetch high-quality piece images online directly 
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        
        // Render board layout
        board = Chessboard('board', config);
        updateStatus();

        // 7. Restart Game Click Handler
        $('#resetBtn').on('click', function() {
            game.reset();
            board.start();
            updateStatus();
        });
    </script>
</body>
</html>
