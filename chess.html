<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Chess</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .header {
            background-color: #161b22;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .board {
            width: 100%;
            max-width: 480px;
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            border: 2px solid #30363d;
            margin: 0 auto;
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5em;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }

        .white {
            background-color: #c9d1d9;
            color: #0d1117;
        }

        .black {
            background-color: #30363d;
            color: #c9d1d9;
        }

        .highlight {
            background-color: #238636;
        }

        .check {
            background-color: #f85149;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: #238636;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #2ea043;
        }

        .difficulty {
            background-color: #161b22;
            padding: 10px;
            border-radius: 6px;
        }

        .timer {
            font-size: 24px;
            font-family: monospace;
            margin: 10px 0;
        }

        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            background-color: #161b22;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>GitHub Chess</h1>
            <div class="difficulty">
                <label for="difficulty">Bot Difficulty:</label>
                <select id="difficulty">
                    <option value="1">Easy (60% accuracy)</option>
                    <option value="2">Medium (80% accuracy)</option>
                    <option value="3">Hard (95% accuracy)</option>
                </select>
            </div>
            <div class="timer" id="timer">5:00</div>
        </div>
        <div class="board" id="board"></div>
        <div class="controls">
            <button onclick="newGame()">New Game</button>
            <button onclick="undoMove()">Undo Move</button>
        </div>
        <div class="message" id="message"></div>
    </div>

    <script>
        const initialBoard = [
            ['♜', '♞', '♝', '♛', '♚', '♝', '♞', '♜'],
            ['♟', '♟', '♟', '♟', '♟', '♟', '♟', '♟'],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['♙', '♙', '♙', '♙', '♙', '♙', '♙', '♙'],
            ['♖', '♘', '♗', '♕', '♔', '♗', '♘', '♖']
        ];

        let board = JSON.parse(JSON.stringify(initialBoard));
        let selectedSquare = null;
        let playerIsWhite = true;
        let gameActive = false;
        let timer = 300; // 5 minutes in seconds
        let increment = 5;
        let timerInterval;
        let moveHistory = [];

        function createBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';

            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const square = document.createElement('div');
                    square.className = square ${(i + j) % 2 === 0 ? 'white' : 'black'};
                    square.dataset.row = i;
                    square.dataset.col = j;
                    square.textContent = board[i][j];
                    square.onclick = () => handleSquareClick(i, j);
                    boardElement.appendChild(square);
                }
            }
        }

        function handleSquareClick(row, col) {
            if (!gameActive) return;
            
            if (selectedSquare === null) {
                if (board[row][col] && isPieceWhite(board[row][col]) === playerIsWhite) {
                    selectedSquare = { row, col };
                    document.querySelector([data-row="${row}"][data-col="${col}"]).classList.add('highlight');
                }
            } else {
                const startRow = selectedSquare.row;
                const startCol = selectedSquare.col;
                
                if (isValidMove(startRow, startCol, row, col)) {
                    const oldBoard = JSON.parse(JSON.stringify(board));
                    moveHistory.push(oldBoard);
                    
                    board[row][col] = board[startRow][startCol];
                    board[startRow][startCol] = '';
                    
                    document.querySelector([data-row="${startRow}"][data-col="${startCol}"]).classList.remove('highlight');
                    createBoard();
                    
                    if (isCheck(!playerIsWhite)) {
                        const kingPos = findKing(!playerIsWhite);
                        document.querySelector([data-row="${kingPos.row}"][data-col="${kingPos.col}"]).classList.add('check');
                        
                        if (isCheckmate(!playerIsWhite)) {
                            endGame('Checkmate! You win!');
                            return;
                        }
                    }
                    
                    timer += increment;
                    playerIsWhite = false;
                    setTimeout(makeComputerMove, 500);
                }
                selectedSquare = null;
            }
        }

        function isValidMove(startRow, startCol, endRow, endCol) {
            const piece = board[startRow][startCol];
            const targetPiece = board[endRow][endCol];
            
            if (targetPiece && isPieceWhite(targetPiece) === isPieceWhite(piece)) {
                return false;
            }
            
            // Basic move validation (simplified)
            const rowDiff = Math.abs(endRow - startRow);
            const colDiff = Math.abs(endCol - startCol);
            
            switch (piece) {
                case '♙':
                case '♟':
                    return colDiff === 0 && ((isPieceWhite(piece) && startRow - endRow === 1) || 
                           (!isPieceWhite(piece) && endRow - startRow === 1));
                case '♖':
                case '♜':
                    return rowDiff === 0 || colDiff === 0;
                case '♘':
                case '♞':
                    return (rowDiff === 2 && colDiff === 1) || (rowDiff === 1 && colDiff === 2);
                case '♗':
                case '♝':
                    return rowDiff === colDiff;
                case '♕':
                case '♛':
                    return rowDiff === colDiff || rowDiff === 0 || colDiff === 0;
                case '♔':
                case '♚':
                    return rowDiff <= 1 && colDiff <= 1;
                default:
                    return false;
            }
        }

        function isPieceWhite(piece) {
            return '♔♕♖♗♘♙'.includes(piece);
        }

        function findKing(isWhite) {
            const kingSymbol = isWhite ? '♔' : '♚';
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    if (board[i][j] === kingSymbol) {
                        return { row: i, col: j };
                    }
                }
            }
        }

        function isCheck(isWhite) {
            const kingPos = findKing(isWhite);
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    if (board[i][j] && isPieceWhite(board[i][j]) !== isWhite) {
                        if (isValidMove(i, j, kingPos.row, kingPos.col)) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function isCheckmate(isWhite) {
            if (!isCheck(isWhite)) return false;
            
            // Try all possible moves for all pieces
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    if (board[i][j] && isPieceWhite(board[i][j]) === isWhite) {
                        for (let r = 0; r < 8; r++) {
                            for (let c = 0; c < 8; c++) {
                                if (isValidMove(i, j, r, c)) {
                                    const tempPiece = board[r][c];
                                    board[r][c] = board[i][j];
                                    board[i][j] = '';
                                    
                                    const stillCheck = isCheck(isWhite);
                                    
                                    board[i][j] = board[r][c];
                                    board[r][c] = tempPiece;
                                    
                                    if (!stillCheck) return false;
                                }
                            }
                        }
                    }
                }
            }
            return true;
        }

        function makeComputerMove() {
            const difficulty = parseInt(document.getElementById('difficulty').value);
            const accuracy = difficulty === 1 ? 0.6 : difficulty === 2 ? 0.8 : 0.95;
            
            let bestMove = null;
            let bestScore = -Infinity;
            
            // Simple move evaluation
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    if (board[i][j] && !isPieceWhite(board[i][j])) {
                        for (let r = 0; r < 8; r++) {
                            for (let c = 0; c < 8; c++) {
                                if (isValidMove(i, j, r, c)) {
                                    const score = Math.random(); // Simplified evaluation
                                    if (score > bestScore) {
                                        bestScore = score;
                                        bestMove = { from: {row: i, col: j}, to: {row: r, col: c} };
                                    }
                                }
                            }
                        }
                    }
                }
            }
            
            if (bestMove && Math.random() < accuracy) {
                const oldBoard = JSON.parse(JSON.stringify(board));
                moveHistory.push(oldBoard);
                
                board[bestMove.to.row][bestMove.to.col] = board[bestMove.from.row][bestMove.from.col];
                board[bestMove.from.row][bestMove.from.col] = '';
                createBoard();
                
                if (isCheck(playerIsWhite)) {
                    const kingPos = findKing(playerIsWhite);
                    document.querySelector([data-row="${kingPos.row}"][data-col="${kingPos.col}"]).classList.add('check');
                    
                    if (isCheckmate(playerIsWhite)) {
                        endGame('Checkmate! Computer wins!');
                        return;
                    }
                }
            }
            
            playerIsWhite = true;
        }

        function updateTimer() {
            if (timer <= 0) {
                endGame('Time's up! Computer wins!');
                return;
            }
            
            const minutes = Math.floor(timer / 60);
            const seconds = timer % 60;
            document.getElementById('timer').textContent = 
                ${minutes}:${seconds.toString().padStart(2, '0')};
            timer--;
        }

        function endGame(message) {
            gameActive = false;
            clearInterval(timerInterval);
            document.getElementById('message').textContent = message;
        }

        function newGame() {
            board = JSON.parse(JSON.stringify(initialBoard));
            selectedSquare = null;
            playerIsWhite = true;
            gameActive = true;
            timer = 300;
            moveHistory = [];
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
            createBoard();
            document.getElementById('message').textContent = '';
        }

        function undoMove() {
            if (moveHistory.length >= 2) {
                board = moveHistory[moveHistory.length - 2];
                moveHistory = moveHistory.slice(0, -2);
                playerIsWhite = true;
                createBoard();
            }
        }

<script>

    function isValidMove(fromRow, fromCol, toRow, toCol) {
        const piece = gameState.board[fromRow][fromCol];
        if (!piece) return false;

        const targetPiece = gameState.board[toRow][toCol];
        if (targetPiece && isPieceWhite(targetPiece) === isPieceWhite(piece)) {
            return false;
        }

        const rowDiff = Math.abs(toRow - fromRow);
        const colDiff = Math.abs(toCol - fromCol);

        switch (piece) {
            case '♙': // White pawn
                if (fromCol === toCol && !targetPiece) { // Forward move
                    if (fromRow === 6 && toRow === 4) { // Initial two-square move
                        return !gameState.board[5][fromCol]; // Check if square in between is empty
                    }
                    return fromRow - toRow === 1; // Regular one-square move
                }
                // Capture move
                return fromRow - toRow === 1 && colDiff === 1 && targetPiece;

            case '♟': // Black pawn
                if (fromCol === toCol && !targetPiece) { // Forward move
                    if (fromRow === 1 && toRow === 3) { // Initial two-square move
                        return !gameState.board[2][fromCol]; // Check if square in between is empty
                    }
                    return toRow - fromRow === 1; // Regular one-square move
                }
                // Capture move
                return toRow - fromRow === 1 && colDiff === 1 && targetPiece;

            case '♖': case '♜': // Rook
                if (rowDiff === 0 || colDiff === 0) {
                    return isPathClear(fromRow, fromCol, toRow, toCol);
                }
                return false;

            case '♘': case '♞': // Knight
                return (rowDiff === 2 && colDiff === 1) || (rowDiff === 1 && colDiff === 2);

            case '♗': case '♝': // Bishop
                if (rowDiff === colDiff) {
                    return isPathClear(fromRow, fromCol, toRow, toCol);
                }
                return false;

            case '♕': case '♛': // Queen
                if (rowDiff === colDiff || rowDiff === 0 || colDiff === 0) {
                    return isPathClear(fromRow, fromCol, toRow, toCol);
                }
                return false;

            case '♔': case '♚': // King
                return rowDiff <= 1 && colDiff <= 1;

            default:
                return false;
        }
    }

    // Add this helper function to check if the path is clear for pieces that move in lines
    function isPathClear(fromRow, fromCol, toRow, toCol) {
        const rowDir = fromRow === toRow ? 0 : (toRow - fromRow) / Math.abs(toRow - fromRow);
        const colDir = fromCol === toCol ? 0 : (toCol - fromCol) / Math.abs(toCol - fromCol);
        
        let currentRow = fromRow + rowDir;
        let currentCol = fromCol + colDir;
        
        while (currentRow !== toRow || currentCol !== toCol) {
            if (gameState.board[currentRow][currentCol] !== '') {
                return false;
            }
            currentRow += rowDir;
            currentCol += colDir;
        }
        return true;
    }

    // Update the computer move function to use valid moves
    function computerMove() {
        const accuracy = document.getElementById('difficulty').value;
        const hitRate = accuracy === 'easy' ? 0.6 : accuracy === 'medium' ? 0.8 : 0.95;

        if (Math.random() < hitRate) {
            let validMoves = [];
            
            // Find all possible valid moves for black pieces
            for (let fromRow = 0; fromRow < 8; fromRow++) {
                for (let fromCol = 0; fromCol < 8; fromCol++) {
                    if (!isPieceWhite(gameState.board[fromRow][fromCol]) && 
                        gameState.board[fromRow][fromCol] !== '') {
                        
                        for (let toRow = 0; toRow < 8; toRow++) {
                            for (let toCol = 0; toCol < 8; toCol++) {
                                if (isValidMove(fromRow, fromCol, toRow, toCol)) {
                                    validMoves.push({
                                        from: {row: fromRow, col: fromCol},
                                        to: {row: toRow, col: toCol}
                                    });
                                }
                            }
                        }
                    }
                }
            }

            if (validMoves.length > 0) {
                const move = validMoves[Math.floor(Math.random() * validMoves.length)];
                makeMove(move.from.row, move.from.col, move.to.row, move.to.col);
                checkForCheckmate();
            }
        }

        gameState.playerTurn = true;
        document.getElementById('status').textContent = "Your turn";
    }

    // Add this function to detect if a king is in check
    function isKingInCheck(isWhiteKing) {
        // Find king's position
        let kingRow, kingCol;
        const kingPiece = isWhiteKing ? '♔' : '♚';
        
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                if (gameState.board[row][col] === kingPiece) {
                    kingRow = row;
                    kingCol = col;
                    break;
                }
            }
        }

        // Check if any opponent's piece can capture the king
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                if (gameState.board[row][col] !== '' && 
                    isPieceWhite(gameState.board[row][col]) !== isWhiteKing) {
                    if (isValidMove(row, col, kingRow, kingCol)) {
                        return true;
                    }
                }
            }
        }
        return false;
    }

    // Update checkForCheckmate function
    function checkForCheckmate() {
        const isWhiteTurn = gameState.playerTurn;
        
        if (isKingInCheck(isWhiteTurn)) {
            const kingPiece = isWhiteTurn ? '♔' : '♚';
            document.getElementById('status').textContent = "Check!";
            
            // Test if any move can get out of check
            for (let fromRow = 0; fromRow < 8; fromRow++) {
                for (let fromCol = 0; fromCol < 8; fromCol++) {
                    if (isPieceWhite(gameState.board[fromRow][fromCol]) === isWhiteTurn) {
                        for (let toRow = 0; toRow < 8; toRow++) {
                            for (let toCol = 0; toCol < 8; toCol++) {
                                if (isValidMove(fromRow, fromCol, toRow, toCol)) {
                                    // Try the move
                                    const originalPiece = gameState.board[toRow][toCol];
                                    const movingPiece = gameState.board[fromRow][fromCol];
                                    gameState.board[toRow][toCol] = movingPiece;
                                    gameState.board[fromRow][fromCol] = '';
                                    
                                    const stillInCheck = isKingInCheck(isWhiteTurn);
                                    
                                    // Undo the move
                                    gameState.board[fromRow][fromCol] = movingPiece;
                                    gameState.board[toRow][toCol] = originalPiece;
                                    
                                    if (!stillInCheck) {
                                        return false; // Found a valid move to get out of check
                                    }
                                }
                            }
                        }
                    }
                }
            }
            // No valid moves found to get out of check
            endGame(isWhiteTurn ? "Checkmate! Computer wins!" : "Checkmate! You win!");
            return true;
        }
        return false;
    }
