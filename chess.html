<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Chess vs Stockfish (20 Levels)</title>
    
    <!-- Chessboard.js Core CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #4caf50;
        }

        /* Matchmaking & Settings Panel */
        .controls-panel {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background: #2a2a35;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: 0.75rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        select {
            background: #1e1e24;
            color: white;
            border: 1px solid #4caf50;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            min-width: 160px;
        }

        /* Responsive chessboard layout */
        #board {
            width: 450px;
            max-width: 90vw;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        .info-panel {
            margin-top: 20px;
            text-align: center;
        }

        #status {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            background: #2a2a35;
            padding: 8px 25px;
            border-radius: 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
            min-width: 200px;
        }

        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #45a049;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>Stockfish Arena</h1>
    
    <!-- Game Configuration Settings -->
    <div class="controls-panel">
        <div class="control-group">
            <label for="colorSelect">Play As</label>
            <select id="colorSelect">
                <option value="w" selected>White</option>
                <option value="b">Black</option>
            </select>
        </div>
        <div class="control-group">
            <label for="difficultySelect">Difficulty</label>
            <select id="difficultySelect">
                <!-- Dynamically generated by JavaScript loop -->
            </select>
        </div>
    </div>

    <!-- The Chessboard Container -->
    <div id="board"></div>

    <!-- Status and Controls -->
    <div class="info-panel">
        <div id="status">Setting up game...</div>
        <button id="startBtn">Start New Game</button>
    </div>

    <!-- External Libraries: jQuery, Chess.js, and Chessboard.js -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

    <script>
        // --- 1. DYNAMIC DIFFICULTY SELECT GENERATOR ---
        var $diffSelect = $('#difficultySelect');
        for (var i = 1; i <= 20; i++) {
            var label = 'Level ' + i;
            
            // Add helpful skill tags along the way
            if (i === 1) label += ' (Novice)';
            if (i === 5) label += ' (Casual)';
            if (i === 10) label += ' (Intermediate)';
            if (i === 15) label += ' (Expert)';
            if (i === 20) label += ' (Grandmaster)';
            
            // Default select Level 5 on startup
            var isSelected = (i === 5) ? ' selected' : '';
            $diffSelect.append('<option value="' + i + '"' + isSelected + '>' + label + '</option>');
        }

        var game = new Chess();
        var board = null;
        var $status = $('#status');
        
        // Game State Variables
        var playerColor = 'w'; 
        var aiLevel = 5;       
        var isAiThinking = false; 

        // Lock down board interaction when it's not the user's turn
        function onDragStart (source, piece, position, orientation) {
            if (game.game_over() || isAiThinking) return false;

            if ((playerColor === 'w' && piece.search(/^b/) !== -1) ||
                (playerColor === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        // Handle human player move dropping
        function onDrop (source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' 
            });

            if (move === null) return 'snapback';
            updateStatus();
        }

        // Trigger the Bot immediately after human finishes moving
        function onSnapEnd () {
            board.position(game.fen());

            if (!game.game_over() && game.turn() !== playerColor) {
                setTimeout(makeAiMove, 300); 
            }
        }

        // Fetch optimal move from the Cloud Stockfish Engine
        function makeAiMove() {
            if (game.game_over()) return;

            isAiThinking = true;
            $status.html("🤖 Bot is plotting its move...");

            // Safeguard: The API caps computational depth at 16. 
            // We map levels 1-20 cleanly, keeping levels 16+ pinned to max performance.
            var targetDepth = Math.min(aiLevel, 16);
            var fenStr = encodeURIComponent(game.fen());
            var url = "https://stockfish.online/api/s/v2.php?fen=" + fenStr + "&depth=" + targetDepth;

            fetch(url)
            .then(res => res.json())
            .then(data => {
                isAiThinking = false;
                
                var rawMoveString = data.bestmove || data.data || "";
                
                if (rawMoveString && rawMoveString.includes("bestmove")) {
                    var parts = rawMoveString.split(" ");
                    var moveStr = parts[1]; 

                    if (moveStr && moveStr.length >= 4) {
                        var fromSquare = moveStr.slice(0, 2);
                        var toSquare = moveStr.slice(2, 4);
                        var promotionPiece = moveStr.length === 5 ? moveStr.slice(4, 5) : 'q';

                        game.move({
                            from: fromSquare,
                            to: toSquare,
                            promotion: promotionPiece
                        });
                        
                        board.position(game.fen());
                        updateStatus();
                        return; 
                    }
                }
                $status.html("⚠️ Engine Error. Try resetting.");
            })
            .catch(err => {
                isAiThinking = false;
                console.error(err);
                $status.html("🌐 Network Error. Check connection.");
            });
        }

        // Update Status Text Display
        function updateStatus () {
            var status = '';
            var moveColor = (game.turn() === 'b') ? 'Black' : 'White';

            if (game.in_checkmate()) {
                status = 'Game over! ' + moveColor + ' is in checkmate.';
            } else if (game.in_draw()) {
                status = 'Game over! Draw position.';
            } else {
                if (game.turn() === playerColor) {
                    status = 'Your turn (' + (playerColor === 'w' ? 'White' : 'Black') + ')';
                } else {
                    status = '🤖 Bot is plotting its move...';
                }
                if (game.in_check()) {
                    status += ' - Check!';
                }
            }
            $status.html(status);
        }

        // Start/Reset Game Loop Configurations
        function startNewGame() {
            game.reset();
            playerColor = $('#colorSelect').val();
            aiLevel = parseInt($('#difficultySelect').val());
            isAiThinking = false;

            board.orientation(playerColor === 'w' ? 'white' : 'black');
            board.start();
            updateStatus();

            if (playerColor === 'b') {
                makeAiMove();
            }
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        
        board = Chessboard('board', config);
        startNewGame(); 

        $('#startBtn').on('click', startNewGame);
    </script>
</body>
</html>
